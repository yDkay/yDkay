<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="coreShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="40%" stop-color="#1a0800"/>
      <stop offset="70%" stop-color="#0d1117" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brightGlow" cx="62%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#FFA500" stop-opacity="0.5"/>
      <stop offset="30%" stop-color="#FF7700" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#CC4400" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dimGlow" cx="38%" cy="58%" r="40%">
      <stop offset="0%" stop-color="#8B2500" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#4A1500" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="medBlur"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="tinyBlur"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="glowF"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <style>
    @keyframes slowSpin { from{transform:rotate(0deg)}to{transform:rotate(360deg)} }
    @keyframes slowSpinR { from{transform:rotate(360deg)}to{transform:rotate(0deg)} }
    @keyframes pulse { 0%,100%{opacity:.5}50%{opacity:.85} }
    @keyframes twinkle { 0%,100%{opacity:.1}50%{opacity:.75} }
    @keyframes crescentPulse { 0%,100%{opacity:.7}50%{opacity:1} }
    @keyframes diskPulse { 0%,100%{opacity:.7}50%{opacity:.9} }
    @keyframes drift { 0%,100%{transform:translateX(0)}50%{transform:translateX(2px)} }
    .orbit-a{animation:slowSpin 80s linear infinite;transform-origin:450px 155px}
    .orbit-b{animation:slowSpinR 55s linear infinite;transform-origin:450px 155px}
    .glow{animation:pulse 5s ease-in-out infinite}
    .disk{animation:diskPulse 6s ease-in-out infinite}
    .crescent{animation:crescentPulse 4s ease-in-out infinite}
    .dot{animation:twinkle 4s ease-in-out infinite}
    .d1{animation-delay:0s}.d2{animation-delay:.35s}.d3{animation-delay:.7s}
    .d4{animation-delay:1.05s}.d5{animation-delay:1.4s}.d6{animation-delay:1.75s}
    .d7{animation-delay:2.1s}.d8{animation-delay:2.45s}.d9{animation-delay:2.8s}
    .d10{animation-delay:3.15s}.d11{animation-delay:.2s}.d12{animation-delay:.55s}
    .d13{animation-delay:.9s}.d14{animation-delay:1.25s}.d15{animation-delay:1.6s}
    .d16{animation-delay:1.95s}.d17{animation-delay:2.3s}.d18{animation-delay:2.65s}
    .qt{animation:drift 7s ease-in-out infinite}
  </style>

  <rect width="900" height="350" fill="#0d1117" rx="12"/>

  <!-- Asymmetric glow halos -->
  <ellipse cx="470" cy="148" rx="180" ry="180" fill="url(#brightGlow)" filter="url(#softBlur)" class="glow"/>
  <ellipse cx="430" cy="162" rx="150" ry="150" fill="url(#dimGlow)" filter="url(#softBlur)" class="glow" style="animation-delay:1s"/>
  <circle cx="450" cy="155" r="100" fill="url(#coreShadow)" filter="url(#medBlur)" opacity=".8"/>

  <!-- Accretion disk layers -->
  <g class="disk">
    <ellipse cx="450" cy="155" rx="165" ry="42" fill="none" stroke="#4A1500" stroke-width="18" opacity=".15" filter="url(#softBlur)"/>
    <ellipse cx="450" cy="155" rx="140" ry="36" fill="none" stroke="#993300" stroke-width="14" opacity=".2" filter="url(#medBlur)"/>
    <ellipse cx="450" cy="155" rx="115" ry="30" fill="none" stroke="#CC5500" stroke-width="10" opacity=".3" filter="url(#medBlur)"/>
    <ellipse cx="450" cy="155" rx="90" ry="24" fill="none" stroke="#FF8C00" stroke-width="6" opacity=".45" filter="url(#tinyBlur)"/>
    <ellipse cx="450" cy="155" rx="68" ry="18" fill="none" stroke="#FFA500" stroke-width="3" opacity=".55" filter="url(#tinyBlur)"/>
    <ellipse cx="450" cy="155" rx="55" ry="14" fill="none" stroke="#FFB833" stroke-width="1.5" opacity=".7"/>
  </g>

  <!-- Tattoo-style flowing lines — outer arcs -->
  <g class="orbit-a" opacity=".75">
    <path d="M450,155 C490,110 580,60 650,35" fill="none" stroke="#E67300" stroke-width="1.1" stroke-linecap="round" opacity=".55"/>
    <path d="M450,155 C505,115 570,85 635,60" fill="none" stroke="#CC5500" stroke-width=".8" stroke-linecap="round" opacity=".4"/>
    <path d="M450,155 C410,200 320,250 250,275" fill="none" stroke="#E67300" stroke-width="1.1" stroke-linecap="round" opacity=".55"/>
    <path d="M450,155 C395,195 330,225 265,250" fill="none" stroke="#CC5500" stroke-width=".8" stroke-linecap="round" opacity=".4"/>
  </g>

  <!-- Inner flowing lines -->
  <g class="orbit-b" opacity=".8">
    <path d="M450,155 C420,125 350,100 280,85" fill="none" stroke="#FFAA44" stroke-width="1" stroke-linecap="round" opacity=".45"/>
    <path d="M450,155 C480,185 550,210 620,225" fill="none" stroke="#FFAA44" stroke-width="1" stroke-linecap="round" opacity=".45"/>
    <path d="M450,155 C415,170 345,205 280,235" fill="none" stroke="#CC5500" stroke-width=".85" stroke-linecap="round" opacity=".35"/>
    <path d="M450,155 C485,140 555,105 620,75" fill="none" stroke="#CC5500" stroke-width=".85" stroke-linecap="round" opacity=".35"/>
  </g>

  <!-- Static depth lines -->
  <path d="M320,55 C370,95 420,135 450,155 C480,175 530,215 590,260" fill="none" stroke="#FF8C00" stroke-width="1.2" stroke-linecap="round" opacity=".3"/>
  <path d="M280,250 C340,210 400,175 450,155 C500,135 560,100 620,60" fill="none" stroke="#FF8C00" stroke-width="1.2" stroke-linecap="round" opacity=".3"/>
  <path d="M380,130 C405,140 430,150 450,155 C430,160 400,175 375,190" fill="none" stroke="#FFB833" stroke-width="1" stroke-linecap="round" opacity=".4"/>
  <path d="M520,130 C495,140 470,150 450,155 C470,160 500,175 525,190" fill="none" stroke="#FFB833" stroke-width="1" stroke-linecap="round" opacity=".4"/>
  <path d="M310,95 C355,100 410,130 450,155" fill="none" stroke="#E67300" stroke-width=".8" stroke-linecap="round" opacity=".25"/>
  <path d="M590,215 C545,210 490,180 450,155" fill="none" stroke="#E67300" stroke-width=".8" stroke-linecap="round" opacity=".25"/>
  <path d="M350,65 C385,100 425,135 450,155" fill="none" stroke="#CC5500" stroke-width=".7" stroke-linecap="round" opacity=".25"/>
  <path d="M550,245 C515,210 475,175 450,155" fill="none" stroke="#CC5500" stroke-width=".7" stroke-linecap="round" opacity=".25"/>
  <path d="M460,145 C500,115 560,80 610,55" fill="none" stroke="#FFAA44" stroke-width=".7" stroke-linecap="round" opacity=".3"/>
  <path d="M465,148 C510,125 575,95 630,72" fill="none" stroke="#FF8C00" stroke-width=".6" stroke-linecap="round" opacity=".2"/>

  <!-- Black hole core -->
  <circle cx="450" cy="155" r="32" fill="#020204"/>
  <circle cx="450" cy="155" r="33" fill="none" stroke="#FF8C00" stroke-width=".7" opacity=".4"/>

  <!-- Photon ring -->
  <circle cx="450" cy="155" r="36" fill="none" stroke="#FFB833" stroke-width="1.2" opacity=".5" filter="url(#glowF)"/>
  <circle cx="450" cy="155" r="38" fill="none" stroke="#FF8C00" stroke-width=".6" opacity=".3"/>

  <!-- Crescent — brighter right side (Doppler beaming) -->
  <g class="crescent">
    <path d="M475,140 C470,150 468,158 475,170" fill="none" stroke="#FFD700" stroke-width="2" stroke-linecap="round" opacity=".8"/>
    <path d="M478,143 C474,152 473,160 478,168" fill="none" stroke="#FFA500" stroke-width="1.2" stroke-linecap="round" opacity=".5"/>
    <path d="M425,142 C430,150 432,158 425,168" fill="none" stroke="#993300" stroke-width="1.5" stroke-linecap="round" opacity=".35"/>
  </g>

  <!-- Scattered dots — stipple -->
  <circle cx="410" cy="125" r="1.8" fill="#FFAA44" class="dot d1"/>
  <circle cx="500" cy="130" r="1.5" fill="#FF8C00" class="dot d2"/>
  <circle cx="415" cy="190" r="1.6" fill="#E67300" class="dot d3"/>
  <circle cx="490" cy="185" r="1.3" fill="#FFB833" class="dot d4"/>
  <circle cx="395" cy="155" r="1" fill="#FFAA44" class="dot d5"/>
  <circle cx="505" cy="150" r="1.4" fill="#FF8C00" class="dot d6"/>
  <circle cx="465" cy="118" r="1.2" fill="#CC5500" class="dot d7"/>
  <circle cx="430" cy="195" r="1.5" fill="#E67300" class="dot d8"/>
  <circle cx="355" cy="105" r="1.5" fill="#CC5500" class="dot d9"/>
  <circle cx="555" cy="110" r="1.8" fill="#FFAA44" class="dot d10"/>
  <circle cx="345" cy="205" r="1.3" fill="#993300" class="dot d11"/>
  <circle cx="560" cy="210" r="1.6" fill="#FF8C00" class="dot d12"/>
  <circle cx="370" cy="150" r="1" fill="#E67300" class="dot d13"/>
  <circle cx="535" cy="160" r="1.2" fill="#FFB833" class="dot d14"/>
  <circle cx="440" cy="100" r="1.4" fill="#CC5500" class="dot d15"/>
  <circle cx="470" cy="215" r="1" fill="#993300" class="dot d16"/>
  <circle cx="290" cy="80" r="1.6" fill="#993300" class="dot d17"/>
  <circle cx="620" cy="75" r="1.3" fill="#CC5500" class="dot d18"/>
  <circle cx="280" cy="235" r="1.4" fill="#662200" class="dot d1"/>
  <circle cx="625" cy="230" r="1.7" fill="#CC5500" class="dot d5"/>
  <circle cx="310" cy="140" r="1" fill="#E67300" class="dot d9"/>
  <circle cx="595" cy="145" r="1.1" fill="#FFAA44" class="dot d13"/>
  <circle cx="120" cy="45" r="1" fill="#FFD700" class="dot d3" opacity=".5"/>
  <circle cx="780" cy="55" r="1.2" fill="#FFA500" class="dot d7" opacity=".4"/>
  <circle cx="100" cy="200" r=".8" fill="#CC5500" class="dot d11" opacity=".4"/>
  <circle cx="800" cy="190" r=".9" fill="#FFB833" class="dot d15" opacity=".3"/>
  <circle cx="170" cy="120" r=".7" fill="#FF8C00" class="dot d2" opacity=".3"/>
  <circle cx="730" cy="130" r=".8" fill="#E67300" class="dot d6" opacity=".3"/>
  <circle cx="200" cy="270" r=".9" fill="#993300" class="dot d10" opacity=".3"/>
  <circle cx="700" cy="260" r="1" fill="#CC5500" class="dot d14" opacity=".3"/>
  <circle cx="425" cy="135" r=".6" fill="#FFD700" class="dot d4"/>
  <circle cx="480" cy="175" r=".6" fill="#FFD700" class="dot d8"/>
  <circle cx="400" cy="170" r=".5" fill="#FFAA44" class="dot d12"/>
  <circle cx="510" cy="140" r=".5" fill="#FFAA44" class="dot d16"/>
  <circle cx="440" cy="115" r=".7" fill="#FF8C00" class="dot d18"/>
  <circle cx="460" cy="198" r=".7" fill="#FF8C00" class="dot d17"/>

  <!-- Quote -->
  <g class="qt">
    <text x="450" y="328" text-anchor="middle" fill="#E68A00" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-style="italic" opacity=".95" letter-spacing=".5">
      "The universe is under no obligation to make sense to you."
    </text>
  </g>
</svg>
